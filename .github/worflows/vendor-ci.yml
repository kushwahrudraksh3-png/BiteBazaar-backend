name: Vendor Feature CI

# Yeh pipeline tab chalegi jab koi epic/vendor-management branch par PR banayega
on:
  pull_request:
    branches:
      - epic/vendor-management

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Apna python version daal dena agar alag ho

      - name: Install System Dependencies (For GeoDjango & PostGIS)
        run: sudo apt-get update && sudo apt-get install -y binutils libproj-dev gdal-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auth & Vendor Tests
        run: |
          python manage.py test accounts
          python manage.py test vendor