name: Release Regression CI

# Yeh pipeline tab chalegi jab vendor epic (ya kisi bhi branch) se 'release' branch par PR aayega
on:
  pull_request:
    branches:
      - release1.0

jobs:
  full-system-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils libproj-dev gdal-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: System-Wide Regression Test (Auth + Vendor)
        run: |
          # Yahan hum saare apps ke test ek sath chalayenge
          python manage.py test accounts
          python manage.py test vendor