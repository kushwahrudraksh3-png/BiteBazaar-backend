name: Vendor Feature CI


on:
  pull_request:
    branches:
      - epic/vendor-management

jobs:
  test:
    runs-on: ubuntu-latest

    # Setup PostGIS Database Service for GitHub Actions
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres  # Default user
          POSTGRES_PASSWORD: postgres # Default password
          POSTGRES_DB: bitebazaar_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # Fixed to match your local env

      - name: Install System Dependencies (For GeoDjango & PostGIS)
        run: sudo apt-get update && sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Auth & Vendor Tests with Coverage
        env:
          # Django settings ke liye environment variables pass kar rahe hain
          SECRET_KEY: 'django-insecure-test-key-for-github-actions'
          DB_NAME: bitebazaar_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          # Pehle accounts ke tests
          # python manage.py test accounts
          
          # Phir vendor ke tests coverage ke sath
          coverage run --source='vendor' manage.py test vendor
          coverage report