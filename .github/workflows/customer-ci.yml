name: BiteBazaar CI Pipeline

on:
  pull_request:
    branches:
      - epic/customer-management 

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # 1. FIX: Plain postgres ki jagah postgis image laga diya
      postgres:
        image: postgis/postgis:15-3.3 
        env:
          POSTGRES_DB: bitebazaar_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' 

    # 2. FIX: GitHub server par GDAL aur Geo libraries install karna
    - name: Install GDAL and Spatial Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev python3-gdal

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage

    - name: Run Tests and Coverage
      env:
        DB_NAME: bitebazaar_db
        DB_USER: postgres
        DB_PASSWORD: password
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        coverage run --source='customer' manage.py test customer
        coverage report